<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque | Login</title>
</head>

<body>
    <main>
        <form class="form-login" id="form-login">
            <input type="text" class="campo-nome-login" id="form-login-nome">
            <input type="password" class="campo-senha-login" id="form-login-senha">
            <input type="submit" value="LOGIN" id="submit-form-login">
        </form>
        <button class="button-cadastro" id="button-cadastro">FAZER CADASTRO</button>
        <p class="campo-login-msg" id="campo-login-msg"></p>
    </main>

    <script src="javascript/index.js"></script>

</body>

</html>
